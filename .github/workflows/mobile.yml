name: Mobile
# BoostRoot Mobile (Android). Every push that touches mobile/ runs the tests and builds a debug APK.
# Run it manually with a version (e.g. 26.11.1) to build the signed Play Store bundle (.aab) + APK and
# publish them as a GitHub release "mobile-v<version>" (never marked "latest", so the PC updater ignores it).
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Mobile version (e.g. 26.11.1)'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu image already ships the Android SDK; just add the platform we compile against.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + screenshot tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mobile/app/build/shots/
      - name: Debug APK
        if: github.event_name == 'push'
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Signed release (.aab + .apk)
        if: github.event_name == 'workflow_dispatch'
        env:
          BR_KEYSTORE_B64: ${{ secrets.BR_KEYSTORE_B64 }}
          BR_KEYSTORE_PASSWORD: ${{ secrets.BR_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          v="${{ inputs.version }}"
          [[ "$v" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "Version must look like 26.11.1"; exit 1; }
          if [ -z "$BR_KEYSTORE_B64" ]; then echo "Secret BR_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$BR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export BR_KEYSTORE="$RUNNER_TEMP/upload.jks"
          ads=""
          [ -n "$ADMOB_APP_ID" ] && ads="$ads -PadmobAppId=$ADMOB_APP_ID"
          [ -n "$ADMOB_BANNER_ID" ] && ads="$ads -PadmobBannerId=$ADMOB_BANNER_ID"
          [ -n "$ADMOB_REWARDED_ID" ] && ads="$ads -PadmobRewardedId=$ADMOB_REWARDED_ID"
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease -PappVersion=$v $ads
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/BoostRoot-Mobile-$v.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/BoostRoot-Mobile-$v.apk"
          notes="Play Store: upload the .aab. Phone test: install the .apk."
          [ -z "$ADMOB_APP_ID" ] && notes="$notes (Built with Google TEST ad ids.)"
          gh release create "mobile-v$v" out/* --title "BoostRoot Mobile $v" --notes "$notes" --latest=false --prerelease
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: boostroot-mobile-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
